name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      # 测试不依赖 MySQL / Redis / RabbitMQ，裸环境即可运行
      - name: 构建与测试
        run: mvn -B --no-transfer-progress verify

      - name: 失败时上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: 前端 lint 与构建
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: concert-ticket-frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: concert-ticket-frontend/package-lock.json

      # lock 已纳入版本管理，用 npm ci 严格按 lock 安装，保证 CI 与本地依赖完全一致
      - name: 安装依赖
        run: npm ci

      - name: 代码检查
        run: npm run lint

      - name: 构建
        run: npm run build
