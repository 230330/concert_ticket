server:
  port: 8090
  servlet:
    context-path: /

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: concert-ticket
  # RabbitMQ 自动配置通过 RabbitMQConditionalExclusionProcessor 条件化排除
  # 当 concert.mq.enabled=false 时自动排除，设为 true 时自动启用
#  # 允许 循环依赖
#  main:
#    allow-circular-references: true

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/concert_ticket?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}  # 生产环境必须通过环境变量注入，默认值仅供本地开发
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000  # 毫秒，HikariCP 不支持 Duration 风格
      pool-name: ConcertHikariCP

  # Redis 配置
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}  # 如有密码请通过环境变量 REDIS_PASSWORD 注入
    database: ${REDIS_DATABASE:0}
    timeout: 10s
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: -1ms

  # RabbitMQ 配置
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # 消息确认机制
    publisher-confirm-type: correlated   # 发布确认（异步回调）
    publisher-returns: true              # 发布退回（消息无法路由时退回）
    template:
      mandatory: true                    # 消息无法路由时强制退回而非丢弃
    # 消费者配置
    listener:
      simple:
        acknowledge-mode: manual         # 手动确认
        prefetch: 10                     # 每次预取消息数
        retry:
          enabled: true                  # 开启消费重试
          max-attempts: 3                # 最大重试次数
          initial-interval: 1000ms       # 初始重试间隔

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss  # 仅对 java.util.Date 生效，LocalDateTime 由 JacksonConfig#objectMapper 统一处理
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.concert.entity
  type-enums-package: com.concert.enums
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开发环境打印SQL，生产环境可注释
  global-config:
    db-config:
      id-type: auto
#      数据库设计中没有逻辑删除字段，这里不需要逻辑删除配置
#      logic-delete-field: delFlag  # 全局逻辑删除字段名
#      logic-delete-value: 1        # 逻辑已删除值
#      logic-not-delete-value: 0    # 逻辑未删除值
      insert-strategy: not_null
      update-strategy: not_null
    banner: false

# JWT 配置
jwt:
  secret: ${JWT_SECRET:ConcertTicketSecretKey2024!@#$%^&*()_+ABCDEFGHIJKLMNOPQRSTUVWXYZ}  # 生产环境必须通过环境变量注入，默认值仅供本地开发
  expiration: ${JWT_EXPIRATION:86400000}  # 24小时，单位毫秒；生产环境建议缩短为 43200000（12小时）
  header: Authorization
  prefix: Bearer

# 阿里云短信配置
aliyun:
  sms:
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}       # 阿里云 AccessKey ID
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}  # 阿里云 AccessKey Secret
    sign-name: ${ALIYUN_SMS_SIGN_NAME:}           # 短信签名
    template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}   # 短信模板编码
    region-id: cn-hangzhou

# 支付宝配置
alipay:
  app-id: ${ALIPAY_APP_ID:}                       # 支付宝应用ID
  private-key: ${ALIPAY_PRIVATE_KEY:}              # 应用私钥
  public-key: ${ALIPAY_PUBLIC_KEY:}                # 支付宝公钥
  gateway: ${ALIPAY_GATEWAY:https://openapi.alipaydev.com/gateway.do}  # 网关地址（沙箱用 dev）
  sign-type: RSA2                                  # 签名算法
  charset: UTF-8
  format: json
  notify-url: ${ALIPAY_NOTIFY_URL:http://localhost:8090/api/pay/alipay/notify}  # 异步回调地址
  return-url: ${ALIPAY_RETURN_URL:http://localhost:9528/#/order/my}              # 同步跳转地址

# 日志配置
logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    root: info
    com.concert: debug
    com.concert.mapper: debug  # 打印 SQL
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/concert-ticket.log
    max-size: 10MB
    max-history: 30

# 演唱会订票系统自定义配置
concert:
  # 消息队列开关（RabbitMQ 不可用时设为 false）
  mq:
    enabled: false
  # 文件上传配置
  upload:
    path: ./uploads/avatar    # 头像上传存储路径
    url-prefix: /uploads/avatar  # 头像访问URL前缀
  # 订单配置
  order:
    expire-minutes: 15  # 订单超时时间（分钟）
    max-tickets-per-order: 4  # 单笔订单最大购票数
    refund-before-hours: 48  # 退款截止时间（演出前多少小时可退）
  # 验证码配置
  captcha:
    expire-minutes: 5  # 验证码过期时间（分钟）
  # 分页配置
  page:
    max-size: 100  # 分页大小上限
    default-size: 10  # 分页大小默认值

# CORS 配置
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:9528}

# SpringDoc API 文档配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  group-configs:
    - group: 用户端接口
      packages-to-scan: com.concert.controller
      paths-to-exclude: /api/admin/**
    - group: 管理端接口
      packages-to-scan: com.concert.controller.admin
