# 测试环境配置
spring:
  datasource:
    # 测试连接目标，可用环境变量 MYSQL_URL 覆盖
    # 说明：现有测试不发起真实查询（Controller 测试用 mock 依赖、其余为 Mockito 单测），
    # 因此测试套件不需要预先准备该库；如需连接真实库请自行创建 concert_ticket_test
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/concert_ticket_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 1  # 使用不同的 Redis 数据库，避免与开发环境冲突

# JWT 配置
jwt:
  secret: ${JWT_SECRET:test-secret-key-for-jwt-token-generation-must-be-at-least-256-bits}  # 测试环境密钥，CI 环境通过环境变量注入
  expiration: 3600000  # 1小时

# 阿里云短信配置（测试环境可以使用 mock）
aliyun:
  sms:
    access-key-id: test-access-key-id
    access-key-secret: test-access-key-secret
    sign-name: 测试签名
    template-code: SMS_TEST001

# 日志配置
logging:
  level:
    com.concert: DEBUG
    org.springframework: WARN
